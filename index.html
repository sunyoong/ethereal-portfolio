<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio 2025 | Premium Experience</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div id="cursor-dot"></div>
    <canvas id="space-canvas"></canvas>

    <nav>
        <a href="index.html">Index</a>
        <a href="projects.html">Works</a>
        <a href="about.html">Profile</a>
        <a href="contact.html">Connect</a>
    </nav>

    <svg id="mascot" viewBox="0 0 100 100">
        <rect x="25" y="35" width="50" height="40" rx="12" fill="#cbd5e1" />
        <circle cx="40" cy="50" r="3" fill="#050505" />
        <circle cx="60" cy="50" r="3" fill="#050505" />
        <line x1="50" y1="35" x2="50" y2="22" stroke="#cbd5e1" stroke-width="3" />
        <circle cx="50" cy="22" r="4" fill="#64748b" />
    </svg>

    <main class="container">
        <h1 id="tagline" data-lang="en">UNFOLDING THE INFINITE</h1>
        <p>Architecting digital experiences through the lens of pure minimalism and high-performance engineering.</p>
        <div style="margin-top: 4rem;">
            <a href="projects.html"
                style="color: var(--text-primary); text-decoration: none; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.3em; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; transition: 0.4s;"
                onmouseover="this.style.borderColor='#fff'" onmouseout="this.style.borderColor='var(--border)'">View
                Selected Works</a>
        </div>
    </main>

    <script type="module" src="./main.js"></script>
    <script type="module">
        const translations = {
            en: "UNFOLDING THE INFINITE",
            ko: "무한한 가능성을 펼치다"
        };
        const tagEl = document.getElementById('tagline');
        tagEl.addEventListener('click', () => {
            const currentLang = tagEl.getAttribute('data-lang');
            const nextLang = currentLang === 'en' ? 'ko' : 'en';

            tagEl.style.filter = "blur(10px)";
            tagEl.style.opacity = 0;

            setTimeout(() => {
                tagEl.textContent = translations[nextLang];
                tagEl.setAttribute('data-lang', nextLang);
                tagEl.style.filter = "blur(0)";
                tagEl.style.opacity = 1;
            }, 400);
        });
        tagEl.style.transition = "all 0.6s cubic-bezier(0.16, 1, 0.3, 1)";
    </script>
</body>

</html>
