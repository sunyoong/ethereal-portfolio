<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <canvas id="space-canvas"></canvas>
    <div class="nebula"></div>
    <div id="cursor"></div>

    <nav>
        <a href="index.html" class="active">Home</a>
        <a href="projects.html">Projects</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <svg id="mascot" viewBox="0 0 100 100">
        <rect x="25" y="35" width="50" height="40" rx="15" fill="#f0f0f0" />
        <circle cx="40" cy="50" r="4" fill="#333">
            <animate attributeName="r" values="4;1;4" dur="3s" repeatCount="indefinite" />
        </circle>
        <circle cx="60" cy="50" r="4" fill="#333">
            <animate attributeName="r" values="4;1;4" dur="3s" repeatCount="indefinite" />
        </circle>
        <line x1="50" y1="35" x2="50" y2="20" stroke="#f0f0f0" stroke-width="4" />
        <circle cx="50" cy="20" r="5" fill="#00d2ff">
            <animate attributeName="fill" values="#00d2ff;#ff00ff;#00d2ff" dur="2s" repeatCount="indefinite" />
        </circle>
    </svg>

    <main class="container">
        <h1 id="greeting">HELLO WORLD</h1>
        <p id="subtext">Welcome to my ethereal universe.</p>
    </main>

    <script type="module" src="./main.js"></script>
    <script type="module">
        const greetings = [
            { t: "HELLO WORLD", s: "English" },
            { t: "안녕, 세상아", s: "Korean" },
            { t: "こんにちは世界", s: "Japanese" },
            { t: "HOLA MUNDO", s: "Spanish" }
        ];
        let langIndex = 0;
        const greetEl = document.getElementById('greeting');
        const subEl = document.getElementById('subtext');

        greetEl.addEventListener('click', () => {
            langIndex = (langIndex + 1) % greetings.length;
            greetEl.classList.remove('swish');
            void greetEl.offsetWidth;
            greetEl.classList.add('swish');
            greetEl.textContent = greetings[langIndex].t;
            subEl.textContent = greetings[langIndex].s;
            document.querySelector('.nebula').style.filter = `hue-rotate(${langIndex * 90}deg) blur(80px)`;
        });
    </script>
</body>

</html>
