<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio 2025 | Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div id="cursor-dot"></div>
    <canvas id="space-canvas"></canvas>

    <nav>
        <a href="index.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <svg id="mascot" viewBox="0 0 100 100" onclick="this.style.transform='rotate(360deg) scale(1.5)'">
        <rect x="25" y="35" width="50" height="40" rx="15" fill="#f0f0f0" />
        <circle cx="40" cy="50" r="4" fill="#333">
            <animate attributeName="r" values="4;1;4" dur="3s" repeatCount="indefinite" />
        </circle>
        <circle cx="60" cy="50" r="4" fill="#333">
            <animate attributeName="r" values="4;1;4" dur="3s" repeatCount="indefinite" />
        </circle>
        <line x1="50" y1="35" x2="50" y2="20" stroke="#f0f0f0" stroke-width="4" />
        <circle cx="50" cy="20" r="5" fill="#6366f1">
            <animate attributeName="fill" values="#6366f1;#a855f7;#6366f1" dur="2s" repeatCount="indefinite" />
        </circle>
    </svg>

    <main class="container">
        <h1 id="tagline">CRAFTING DIGITAL DIMENSIONS</h1>
        <p>Turning visionary concepts into high-performance, aesthetically driven reality.</p>
        <div style="margin-top: 3.5rem; display: flex; justify-content: center; gap: 1rem;">
            <a href="projects.html"
                style="background: var(--text); color: var(--bg); padding: 1rem 2.5rem; border-radius: 100px; text-decoration: none; font-weight: 600; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);">Explore
                Space</a>
        </div>
    </main>

    <script type="module" src="./main.js"></script>
    <script type="module">
        const taglines = [
            "CRAFTING DIGITAL DIMENSIONS",
            "DESIGNING FOR THE FUTURE",
            "ENGINEERING ELEGANCE",
            "CODE THAT CAPTIVATES"
        ];
        let index = 0;
        const tagEl = document.getElementById('tagline');
        tagEl.addEventListener('click', () => {
            index = (index + 1) % taglines.length;
            tagEl.style.transform = "translateY(-10px)";
            tagEl.style.opacity = 0;
            setTimeout(() => {
                tagEl.textContent = taglines[index];
                tagEl.style.transform = "translateY(0)";
                tagEl.style.opacity = 1;
            }, 300);
        });
        tagEl.style.transition = "all 0.3s cubic-bezier(0.16, 1, 0.3, 1)";
        tagEl.style.cursor = "pointer";
    </script>
</body>

</html>
