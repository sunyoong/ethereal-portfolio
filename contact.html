<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio 2025 | Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div id="cursor-dot"></div>
    <canvas id="space-canvas"></canvas>

    <nav>
        <a href="index.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>

    <svg id="mascot" viewBox="0 0 100 100">
        <rect x="25" y="35" width="50" height="40" rx="15" fill="#f0f0f0" />
        <circle cx="40" cy="50" r="4" fill="#333">
            <animate attributeName="r" values="4;1;4" dur="3s" repeatCount="indefinite" />
        </circle>
        <circle cx="60" cy="50" r="4" fill="#333">
            <animate attributeName="r" values="4;1;4" dur="3s" repeatCount="indefinite" />
        </circle>
        <line x1="50" y1="35" x2="50" y2="20" stroke="#f0f0f0" stroke-width="4" />
        <circle cx="50" cy="20" r="5" fill="#6366f1">
            <animate attributeName="fill" values="#6366f1;#a855f7;#6366f1" dur="2s" repeatCount="indefinite" />
        </circle>
    </svg>

    <main class="container">
        <h1>GET IN TOUCH</h1>
        <p>Ready to build the next big thing together? Let's connect across the digital void.</p>
        <div style="margin-top: 3rem; display: flex; flex-direction: column; gap: 1.5rem;">
            <a href="mailto:contact@universe.com"
                style="color: var(--primary); text-decoration: none; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em;">contact@universe.com</a>
            <div style="display: flex; justify-content: center; gap: 2rem; margin-top: 1rem;">
                <a href="#"
                    style="color: rgba(255,255,255,0.4); text-decoration: none; font-weight: 600; transition: color 0.3s;"
                    onmouseover="this.style.color='#fff'"
                    onmouseout="this.style.color='rgba(255,255,255,0.4)'">GitHub</a>
                <a href="#"
                    style="color: rgba(255,255,255,0.4); text-decoration: none; font-weight: 600; transition: color 0.3s;"
                    onmouseover="this.style.color='#fff'"
                    onmouseout="this.style.color='rgba(255,255,255,0.4)'">LinkedIn</a>
                <a href="#"
                    style="color: rgba(255,255,255,0.4); text-decoration: none; font-weight: 600; transition: color 0.3s;"
                    onmouseover="this.style.color='#fff'"
                    onmouseout="this.style.color='rgba(255,255,255,0.4)'">Twitter</a>
            </div>
        </div>
    </main>

    <script type="module" src="./main.js"></script>
</body>

</html>
